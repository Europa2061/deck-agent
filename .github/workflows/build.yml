name: Release Deck Agent

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 版本升级 / Version increment
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]
      prerelease:
        description: 标记为测试版 / Mark as prerelease
        required: true
        default: true
        type: boolean

concurrency:
  group: deck-agent-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    outputs:
      version: ${{ steps.package.outputs.version }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Require the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            runtime/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and check
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm run test:frontend
          npm run build
          python3 scripts/prepare_runtime.py
          DECK_AGENT_DEV=1 npm test
          python3 scripts/check_docs.py
      - name: Commit the version and package once
        id: package
        env:
          RELEASE_BUMP: ${{ inputs.bump }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          npm run package -- --bump "$RELEASE_BUMP" --commit-version
          PACKAGE_VERSION=$(node -p 'require("./package.json").version')
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"
          echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
      - name: Verify candidate
        run: |
          python3 scripts/smoke_package.py
          python3 scripts/decky_compat_report.py
          python3 scripts/verify_release.py --tag "v$PACKAGE_VERSION"
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v4
        with:
          name: deck-agent-${{ env.PACKAGE_VERSION }}-linux-x64
          if-no-files-found: error
          retention-days: 30
          path: |
            out/deck-agent-${{ env.PACKAGE_VERSION }}.zip
            out/deck-agent-${{ env.PACKAGE_VERSION }}.zip.sha256
      - name: Push version and tag atomically
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git tag "v$PACKAGE_VERSION"
          git push --atomic origin "HEAD:refs/heads/$DEFAULT_BRANCH" "refs/tags/v$PACKAGE_VERSION"
  draft:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      PACKAGE_VERSION: ${{ needs.build.outputs.version }}
      TEST_RELEASE: ${{ inputs.prerelease }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deck-agent-${{ needs.build.outputs.version }}-linux-x64
          path: out
      - name: Create or complete a release draft
        run: |
          RELEASE_FLAGS=()
          if [ "$TEST_RELEASE" = true ]; then RELEASE_FLAGS+=(--prerelease); fi
          if IS_DRAFT=$(gh release view "v$PACKAGE_VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft); then
            test "$IS_DRAFT" = true
            gh release upload "v$PACKAGE_VERSION" \
              "out/deck-agent-$PACKAGE_VERSION.zip" \
              "out/deck-agent-$PACKAGE_VERSION.zip.sha256" \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "v$PACKAGE_VERSION" \
              "out/deck-agent-$PACKAGE_VERSION.zip" \
              "out/deck-agent-$PACKAGE_VERSION.zip.sha256" \
              --repo "$GITHUB_REPOSITORY" --verify-tag --draft --generate-notes \
              --title "Deck Agent $PACKAGE_VERSION" "${RELEASE_FLAGS[@]}"
          fi
          RELEASE_URL=$(gh release view "v$PACKAGE_VERSION" --repo "$GITHUB_REPOSITORY" --json url --jq .url)
          echo "Release draft: $RELEASE_URL" >> "$GITHUB_STEP_SUMMARY"
          echo 'Download and test this candidate on Steam Deck, then publish the draft.' >> "$GITHUB_STEP_SUMMARY"
